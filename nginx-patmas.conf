# Sample nginx site for patmas behind TLS, both compose variants (app on 127.0.0.1:8080).
# Copy to /etc/nginx/conf.d/patmas.conf (or sites-available + symlink), replace patmas.example.com and the certificate
# paths (e.g. from certbot), then: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name patmas.example.com;

    # certbot HTTP-01 challenge; remove if you get certificates another way
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;  # nginx 1.25.1+; older versions: "listen 443 ssl http2;"
    server_name patmas.example.com;

    ssl_certificate     /etc/letsencrypt/live/patmas.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patmas.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Largest upload is a DPMA package of 100 MB; the app allows 101M (quarkus.http.limits.max-body-size)
    client_max_body_size 101m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # The app trusts these only from the compose gateway (QUARKUS_HTTP_PROXY_TRUSTED_PROXIES): it builds
        # https redirects and logs the client address from them
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Uploads go to the app as they arrive, not into a temp file first
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # MCP (Streamable HTTP): responses may stream as server-sent events, so no buffering and long reads
    location /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
